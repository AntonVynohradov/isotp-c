name: Python Integration Tests

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Configure (IntegrationTests preset)
        run: cmake --preset "ISOTP[IntegrationTests]" -B "build/ISOTP[IntegrationTests]" -DPython3_EXECUTABLE="$(which python)"

      - name: Run integration tests
        run: cmake --build "build/ISOTP[IntegrationTests]" --target integration_tests

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-tests-report
          path: build/ISOTP\[IntegrationTests\]/integration-tests.xml
