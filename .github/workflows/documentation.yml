name: Build and Deploy Documentation

on:
  workflow_run:
    workflows: ["Build Static Library"]
    types:
      - completed

permissions:
  contents: write

jobs:
  documentation:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz libpango-1.0-0 libpangoft2-1.0-0
          pip install mkdocs mkdocs-material mkdoxy mkdocs-autorefs weasyprint

      - name: Build PDF manual
        run: |
          # Published with the site as /downloads/ISOTP-C_User_Manual.pdf
          python tools/docs/build_manual.py --output docs/downloads/ISOTP-C_User_Manual.pdf

      # actions/checkout leaves an HTTPS remote authenticated with GITHUB_TOKEN
      # (contents: write), so gh-deploy can push to gh-pages without a deploy key.
      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploying documentation
        run: |
          mkdocs gh-deploy --force
