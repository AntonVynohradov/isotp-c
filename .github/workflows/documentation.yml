name: Build and Deploy Documentation

# Deploys the documentation of a published version: runs after the Release
# workflow of a vX.Y.Z tag and builds the site from the tagged commit.
on:
  workflow_run:
    workflows: ["Release"]
    types:
      - completed

permissions:
  contents: write

jobs:
  documentation:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz libpango-1.0-0 libpangoft2-1.0-0
          pip install mkdocs mkdocs-material mkdoxy mkdocs-autorefs weasyprint

      - name: Build PDF manual
        run: |
          # Published with the site as /downloads/ISOTP-C_User_Manual.pdf
          python tools/docs/build_manual.py --output docs/downloads/ISOTP-C_User_Manual.pdf

      # The "gh-pages protection" ruleset rejects pushes made with GITHUB_TOKEN;
      # the deploy key (secret GH_PAGES_DEPLOY_KEY) is allowed to bypass it.
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GH_PAGES_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Switch remote to SSH
        run: |
          git remote set-url origin git@github.com:${{ github.repository }}.git

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploying documentation
        run: |
          mkdocs gh-deploy --force
